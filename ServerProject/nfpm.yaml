name: serverguard
arch: amd64
platform: linux
version: 1.1.12
release: 1
section: admin
priority: optional
maintainer: ServerGuard
description: ServerGuard Linux server security manager
vendor: ServerGuard
homepage: https://serverguard.site
license: Proprietary

contents:
  # Main executable
  - src: build-linux/ServerGuard
    dst: /usr/bin/serverguard
    file_info:
      mode: 0755

  # Linux updater script
  - src: packaging/linux/update-serverguard.sh
    dst: /usr/share/serverguard/update-serverguard.sh
    file_info:
      mode: 0755

overrides:
  deb:
    depends:
      - libc6
      - libssl3t64
      - libssh2-1t64
      - zlib1g
      - libstdc++6
      - libgcc-s1
  rpm:
    depends:
      - glibc
      - openssl-libs
      - libssh2
      - zlib
      - libstdc++
      - libgcc
  archlinux:
    depends:
      - glibc
      - openssl
      - libssh2
      - zlib
      - gcc-libs